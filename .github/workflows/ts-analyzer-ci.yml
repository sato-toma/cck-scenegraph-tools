name: ts-analyzer CI

on:
  push:
    paths:
      - 'packages/ts-analyzer/**'
      - '.vscode/tasks.json'
      - 'scripts/**'
      - 'packages/ts-analyzer/.nvmrc'
      - '.github/workflows/ts-analyzer-ci.yml'
  pull_request:
    paths:
      - 'packages/ts-analyzer/**'
      - '.vscode/tasks.json'
      - 'scripts/**'
      - 'packages/ts-analyzer/.nvmrc'
      - '.github/workflows/ts-analyzer-ci.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: packages/ts-analyzer/.nvmrc
          cache: 'npm'
          cache-dependency-path: packages/ts-analyzer/package-lock.json

      - name: Install dependencies
        working-directory: packages/ts-analyzer
        run: npm ci

      - name: Build package
        working-directory: packages/ts-analyzer
        run: npm run build

      - name: Run tests
        working-directory: packages/ts-analyzer
        run: npm run test

      - name: Verify machine-readable analysis reports
        working-directory: packages/ts-analyzer
        run: |
          node dist/cli.js analyze src/fixtures/scene-graph-export.toml examples/sample.ts --format json > "$RUNNER_TEMP/analysis-report.json"
          node dist/cli.js analyze src/fixtures/scene-graph-export.toml examples/sample.ts --format sarif > "$RUNNER_TEMP/analysis-report.sarif"
          node -e "const fs = require('fs'); const report = JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); if (report.schemaVersion !== 1 || report.results[0].componentRequests.length !== 2) process.exit(1)" "$RUNNER_TEMP/analysis-report.json"
          node -e "const fs = require('fs'); const report = JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); if (report.version !== '2.1.0' || report.runs[0].results.length !== 1) process.exit(1)" "$RUNNER_TEMP/analysis-report.sarif"

      - name: Render analyzer findings as GitHub Actions annotations
        if: github.event_name == 'workflow_dispatch'
        working-directory: packages/ts-analyzer
        run: node dist/cli.js analyze src/fixtures/scene-graph-export.toml examples/sample.ts --format github-actions

      - name: Test shell export wrapper
        run: |
          chmod +x scripts/ci/fake-unity.sh
          chmod +x scripts/export-and-analyze.sh
          mkdir -p "$RUNNER_TEMP/scenegraph-fixture"
          ./scripts/export-and-analyze.sh \
            --unity-path "$GITHUB_WORKSPACE/scripts/ci/fake-unity.sh" \
            --project-path "$RUNNER_TEMP/scenegraph-fixture" \
            --script-path "$GITHUB_WORKSPACE/packages/unity-semantic-graph/Samples~/Assets/Script/src/onGrabScript.ts" \
            --output-path SceneGraph.generated.toml \
            --log-path scenegraph-export.log \
            --fail-on-issues \
            --fail-on-unverified
          ./scripts/export-and-analyze.sh \
            --unity-path "$GITHUB_WORKSPACE/scripts/ci/fake-unity.sh" \
            --project-path "$RUNNER_TEMP/scenegraph-fixture" \
            --script-path "$GITHUB_WORKSPACE/packages/unity-semantic-graph/Samples~/Assets/Script/src/onGrabScript.ts" \
            --output-path SceneGraph.structured.toml \
            --log-path scenegraph-structured-export.log \
            --format json \
            > "$RUNNER_TEMP/export-analysis-report.json"
          node -e "const fs = require('fs'); const report = JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); if (report.schemaVersion !== 1 || report.results[0].summary.componentRequestCounts.satisfied !== 1) process.exit(1)" "$RUNNER_TEMP/export-analysis-report.json"

  powershell-wrapper:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: packages/ts-analyzer/.nvmrc
          cache: 'npm'
          cache-dependency-path: packages/ts-analyzer/package-lock.json

      - name: Install dependencies
        working-directory: packages/ts-analyzer
        run: npm ci

      - name: Build package
        working-directory: packages/ts-analyzer
        run: npm run build

      - name: Test PowerShell export wrapper
        shell: pwsh
        env:
          PROJECT_PATH: ${{ runner.temp }}\scenegraph-fixture
        run: |
          New-Item -ItemType Directory -Force -Path $env:PROJECT_PATH | Out-Null
          .\scripts\export-and-analyze.ps1 `
            --unity-path "$env:GITHUB_WORKSPACE\scripts\ci\fake-unity.ps1" `
            --project-path $env:PROJECT_PATH `
            --script-path "$env:GITHUB_WORKSPACE\packages\unity-semantic-graph\Samples~\Assets\Script\src\onGrabScript.ts" `
            --output-path SceneGraph.generated.toml `
            --log-path scenegraph-export.log `
            --fail-on-issues `
            --fail-on-unverified
