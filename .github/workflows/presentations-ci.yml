name: presentations CI

on:
  push:
    paths:
      - 'presentations/**'
      - 'presentations/.nvmrc'
      - '.github/workflows/presentations-ci.yml'
  pull_request:
    paths:
      - 'presentations/**'
      - 'presentations/.nvmrc'
      - '.github/workflows/presentations-ci.yml'
  workflow_dispatch:

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: presentations/.nvmrc
          cache: 'npm'
          cache-dependency-path: presentations/package-lock.json

      - name: Install dependencies
        working-directory: presentations
        run: npm ci

      - name: Build PDF
        working-directory: presentations
        run: npm run build

      - name: Verify PDF was generated
        working-directory: presentations
        run: test -s dist/repository-overview.pdf
